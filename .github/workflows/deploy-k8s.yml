name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-k8s-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/samueldbines/bareframe/site

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SamuelDBines/bareframe

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Skip deploy without cluster credentials
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN == '' }}
        run: echo "DIGITALOCEAN_ACCESS_TOKEN is not configured; skipping Kubernetes deploy."

      - name: Checkout
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Install doctl
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl for london-cluster
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        run: doctl kubernetes cluster kubeconfig save london-cluster

      - name: Install kustomize
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        run: |
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Set deployment image tag
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        working-directory: deploy/k8s
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          kustomize edit set image "ghcr.io/samueldbines/bareframe/site=ghcr.io/samueldbines/bareframe/site:sha-${SHORT_SHA}"

      - name: Apply manifests and wait for rollout
        if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          kubectl apply -k deploy/k8s
          if ! kubectl rollout status deployment/bareframe-site -n bareframe --timeout=180s; then
            kubectl rollout undo deployment/bareframe-site -n bareframe || true
            exit 1
          fi
