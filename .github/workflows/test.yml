name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bareframe
          POSTGRES_PASSWORD: bareframe
          POSTGRES_DB: bareframe
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bareframe -d bareframe"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Build designer-core
        run: |
          cd packages/designer-core
          npm install
          npm run build

      - name: Build flow-map-engine
        run: |
          cd packages/flow-map-engine
          npm install
          npm run build

      - name: Build package contracts and generator
        run: |
          cd packages/package-contracts && npm install && npm run build
          cd ../design-handoff && npm install && npm run build
          node ../../mcp/scripts/bundle-catalog.mjs
          cd ../package-generator && npm install && npm run build

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: API typecheck
        working-directory: api
        run: npm run typecheck

      - name: Install Playwright Chromium for render tests
        working-directory: api
        run: npx playwright install --with-deps chromium

      - name: API tests
        working-directory: api
        env:
          DATABASE_URL: postgres://bareframe:bareframe@127.0.0.1:54329/bareframe
          RENDER_ALLOW_HOSTS: 127.0.0.1
          RENDER_INLINE: "1"
          BAREFRAME_CATALOG_PATH: ${{ github.workspace }}/mcp/data/catalog.json
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: bareframe-api:ci

      - name: Verify API image runs as uid 10001
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id bareframe-api:ci | grep -q 'uid=10001'

      - name: Build render worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: render/Dockerfile
          push: false
          load: true
          tags: bareframe-render-worker:ci

      - name: Verify render worker image runs as uid 10001
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id bareframe-render-worker:ci | grep -q 'uid=10001'

  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bareframe
          POSTGRES_PASSWORD: bareframe
          POSTGRES_DB: bareframe
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bareframe -d bareframe"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library artifacts for MCP catalog
        run: |
          pnpm run build:lib
          pnpm run generate:component-props
          pnpm run build:react
          node mcp/scripts/bundle-catalog.mjs

      - name: Build design-handoff
        run: |
          cd packages/design-handoff && npm install && npm run build

      - name: Build designer-core and API (studio e2e)
        run: |
          node mcp/scripts/bundle-catalog.mjs
          cd "$GITHUB_WORKSPACE/packages/package-contracts" && npm install && npm run build
          cd "$GITHUB_WORKSPACE/packages/design-handoff" && npm install && npm run build
          cd "$GITHUB_WORKSPACE/packages/designer-core" && npm install && npm run build
          cd "$GITHUB_WORKSPACE/packages/package-generator" && npm install && npm run build
          cd "$GITHUB_WORKSPACE/packages/flow-map-engine" && npm install && npm run build
          cd "$GITHUB_WORKSPACE/api" && npm ci && npm run build

      - name: MCP typecheck
        run: pnpm run mcp:typecheck

      - name: Install Playwright Chromium for flow-map MCP e2e
        working-directory: api
        run: npx playwright install --with-deps chromium

      - name: MCP build and tests
        env:
          DATABASE_URL: postgres://bareframe:bareframe@127.0.0.1:54329/bareframe
          RENDER_ALLOW_HOSTS: 127.0.0.1
          RENDER_INLINE: "1"
        run: pnpm run mcp:build && pnpm run mcp:test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: false
          load: true
          tags: bareframe-mcp:ci

      - name: Verify MCP image health endpoint
        run: |
          set -euo pipefail
          docker run -d --name bareframe-mcp -p 18081:8080 bareframe-mcp:ci
          sleep 2
          curl -sf http://127.0.0.1:18081/mcp/healthz | grep -q '^ok$'
          docker rm -f bareframe-mcp

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build site image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bareframe-site:ci

      - name: Build Designer image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: designer/Dockerfile
          push: false
          load: true
          tags: bareframe-designer:ci

      - name: Verify nginx redirects in container
        run: |
          set -euo pipefail
          docker run -d --name bareframe-nginx -p 18080:8080 bareframe-site:ci
          sleep 2
          curl -sf http://127.0.0.1:18080/healthz | grep -q '^ok$'
          LOC=$(curl -sI -H 'Host: bareframe.org' 'http://127.0.0.1:18080/legacy' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          test "$LOC" = '/legacy/'
          ALIAS_LOC=$(curl -sI -H 'Host: www.bareframe.org' 'http://127.0.0.1:18080/legacy/foo' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          test "$ALIAS_LOC" = 'https://bareframe.org/legacy/foo'
          docker rm -f bareframe-nginx

      - name: Verify Designer nginx health in container
        run: |
          set -euo pipefail
          docker run -d --name bareframe-designer -p 18082:8080 bareframe-designer:ci
          sleep 2
          curl -sf http://127.0.0.1:18082/healthz | grep -q '^ok$'
          docker rm -f bareframe-designer

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        run: |
          curl -sfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @bareframe/designer-core
        run: pnpm --filter @bareframe/designer-core build

      - name: Install Playwright Chromium (consumer smoke + e2e)
        run: pnpm exec playwright install --with-deps chromium

      - name: Test @bareframe/react (unit + coverage)
        run: pnpm run test:react

      - name: Build @bareframe/react package
        run: pnpm run build:react

      - name: publint + @arethetypeswrong for @bareframe/react
        run: pnpm run react:pack-quality

      - name: Consumer smoke test (packed tarball + Vite)
        run: pnpm run react:consumer-smoke

      - name: Typecheck (root TS)
        run: pnpm run typecheck

      - name: Build library + sync public/dist and public/themes
        run: pnpm run build

      - name: Validate example theme (minimal contract)
        run: pnpm run validate:theme -- examples/theme-mybrand.css

      - name: Validate system theme (minimal contract)
        run: pnpm run validate:theme -- themes/system.css

      - name: Generate static example pages + versions metadata
        run: |
          node ./scripts/generate-examples.mjs
          node ./scripts/generate-versions.mjs

      - name: Re-sync artifact into public after generators
        run: pnpm run prep-pages

      - name: Build showcase (Component Studio → public/showcase/)
        working-directory: showcase
        run: pnpm install --frozen-lockfile && pnpm exec vite build

      - name: Build product prototype (→ public/prototype/)
        working-directory: prototype
        run: pnpm install --frozen-lockfile && pnpm test && BAREFRAME_PAGES_ROOT=1 pnpm run build

      - name: Build Designer app (→ public/designer/)
        working-directory: prototype
        run: |
          VITE_BAREFRAME_APP=designer \
          VITE_DOCS_SITE_URL=https://bareframe.org \
          VITE_DESIGNER_SITE_URL=https://designer.bareframe.org \
          BAREFRAME_DESIGNER_BUILD=1 \
          pnpm run build
          cp ../public/designer/designer.html ../public/designer/index.html

      - name: Finalize Pages layout (prototype @ root, legacy @ /legacy/)
        run: node ./scripts/finalize-pages.mjs

      - name: Smoke-check Pages artifact
        run: pnpm run smoke:pages

      - name: Install Playwright (WebKit for e2e)
        run: pnpm exec playwright install --with-deps webkit

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true
