<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link id="themeStylesheet" rel="stylesheet" href="../themes/system.css" />
    <title>Bareframe · bf-button</title>
    <style>
      body {
        margin: 0;
        font-family: var(--bf-theme-font-family, system-ui, sans-serif);
        background: var(--bf-theme-surface-2, #f8fafc);
        color: var(--bf-theme-text-1);
        padding: 1.25rem;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        display: grid;
        gap: 1rem;
      }
      .panel {
        padding: 1rem;
        border-radius: var(--bf-theme-radius-md, 12px);
        border: 1px solid var(--bf-theme-border-1);
        background: var(--bf-theme-surface-1);
      }
      .theme-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      code {
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="panel">
        <div class="theme-controls">
          <label for="themeSelect">Theme</label>
          <select id="themeSelect">
            <option value="system">system</option>
            <option value="dark">dark</option>
            <option value="light">light</option>
            <option value="modern">modern</option>
            <option value="layout">layout</option>
            <option value="aurora">aurora</option>
            <option value="noir">noir</option>
            <option value="oceanic">oceanic</option>
            <option value="nature">nature</option>
            <option value="matrix">matrix</option>
            <option value="retro">retro</option>
            <option value="simple">simple</option>
            <option value="sprint">sprint</option>
            <option value="sunrise">sunrise</option>
            <option value="desert">desert</option>
            <option value="future">future</option>
            <option value="nebula">nebula</option>
          </select>
          <span id="themeStatus"></span>
        </div>
      </section>
      <section class="panel">
        <h2 style="margin: 0 0 0.5rem"><code>bf-button</code></h2>
        <p style="margin: 0 0 0.75rem; opacity: 0.85; font-size: 0.9rem">Variants use the <code>variant</code> attribute.</p>
        <div class="row">
          <bf-button label="Primary" variant="primary"></bf-button>
          <bf-button label="Secondary" variant="secondary"></bf-button>
          <bf-button label="Outlined" variant="outlined"></bf-button>
          <bf-button label="Ghost" variant="ghost"></bf-button>
          <bf-button label="Disabled" variant="primary" disabled></bf-button>
        </div>
      </section>
    </div>
    <script type="module" src="../dist/index.js"></script>
    <script type="module">
      const themeStylesheet = document.getElementById('themeStylesheet');
      const themeSelect = document.getElementById('themeSelect');
      const themeStatus = document.getElementById('themeStatus');
      function applyTheme(t) {
        themeStylesheet.href = '../themes/' + t + '.css';
        document.documentElement.setAttribute('data-bf-theme', t);
        themeStatus.textContent = 'Active: ' + t;
      }
      themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));
      applyTheme(themeSelect.value);
    </script>
  </body>
</html>
