apiVersion: apps/v1
kind: Deployment
metadata:
  name: bareframe-mcp
  labels:
    app: bareframe-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bareframe-mcp
  template:
    metadata:
      labels:
        app: bareframe-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/samueldbines/bareframe/mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BAREFRAME_MCP_BASE_PATH
              value: /v1
            - name: BAREFRAME_MCP_ALLOWED_HOSTS
              value: mcp.bareframe.dev
          envFrom:
            - secretRef:
                name: bareframe-mcp-env
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
