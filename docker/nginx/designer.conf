server {
    listen 8080 default_server;
    server_name designer.bareframe.org _;

    absolute_redirect off;
    port_in_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 302 https://bareframe.org/#/app;
    }
}
