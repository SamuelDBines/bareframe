name: Kitsune

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Security scan (secrets)
        env:
          KITSUNE_API_KEY: ${{ secrets.KITSUNE_API_KEY }}
        run: |
          if [ -z "$KITSUNE_API_KEY" ]; then
            echo "KITSUNE_API_KEY is not set — skipping Kitsune scan (configure in repo secrets to enable)."
            exit 0
          fi
          if ! command -v kitsune >/dev/null 2>&1; then
            echo "Kitsune CLI is not installed on this runner."
            echo "Add a release install step to .github/workflows/kitsune.yml when binaries are published."
            exit 0
          fi
          kitsune security scan --all
