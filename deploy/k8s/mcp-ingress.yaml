apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bareframe-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.bareframe.dev
      secretName: bareframe-mcp-tls
  rules:
    - host: mcp.bareframe.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bareframe-mcp
                port:
                  name: http
