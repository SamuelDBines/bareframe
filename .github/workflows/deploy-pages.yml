name: Deploy Public To Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library + sync public/dist and public/themes
        run: pnpm run build

      - name: Generate static example pages
        run: |
          node ./scripts/generate-examples.mjs
          node ./scripts/generate-versions.mjs

      - name: Re-sync artifact into public after generators
        run: pnpm run prep-pages

      - name: Build showcase (Component Studio → public/showcase/)
        working-directory: showcase
        run: pnpm install --frozen-lockfile && pnpm exec vite build

      - name: Build product prototype (→ public/prototype/)
        working-directory: prototype
        run: pnpm install --frozen-lockfile && BAREFRAME_PAGES_ROOT=1 pnpm run build

      - name: Finalize Pages layout (prototype @ root, legacy @ /legacy/)
        run: node ./scripts/finalize-pages.mjs

      - name: Smoke-check Pages artifact
        run: pnpm run smoke:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
