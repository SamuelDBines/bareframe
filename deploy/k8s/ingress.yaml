apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bareframe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bareframe.org
      secretName: bareframe-tls
    - hosts:
        - designer.bareframe.org
      secretName: designer-bareframe-tls
  rules:
    - host: bareframe.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bareframe-api
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: bareframe-mcp
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bareframe-site
                port:
                  name: http
    - host: designer.bareframe.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bareframe-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bareframe-designer
                port:
                  name: http
