name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build site image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        run: |
          curl -sfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (root TS)
        run: pnpm run typecheck

      - name: Build library + sync public/dist and public/themes
        run: pnpm run build

      - name: Validate example theme (minimal contract)
        run: pnpm run validate:theme -- examples/theme-mybrand.css

      - name: Validate system theme (minimal contract)
        run: pnpm run validate:theme -- themes/system.css

      - name: Generate static example pages + versions metadata
        run: |
          node ./scripts/generate-examples.mjs
          node ./scripts/generate-versions.mjs

      - name: Re-sync artifact into public after generators
        run: pnpm run prep-pages

      - name: Build showcase (Component Studio → public/showcase/)
        working-directory: showcase
        run: pnpm install --frozen-lockfile && pnpm exec vite build

      - name: Build product prototype (→ public/prototype/)
        working-directory: prototype
        run: pnpm install --frozen-lockfile && BAREFRAME_PAGES_ROOT=1 pnpm run build

      - name: Finalize Pages layout (prototype @ root, legacy @ /legacy/)
        run: node ./scripts/finalize-pages.mjs

      - name: Smoke-check Pages artifact
        run: pnpm run smoke:pages

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true
