<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link id="themeStylesheet" rel="stylesheet" href="../themes/system.css" />
    <title>Bareframe · bf-modal</title>
    <style>
      body {
        margin: 0;
        font-family: var(--bf-theme-font-family, system-ui, sans-serif);
        background: var(--bf-theme-surface-2, #f8fafc);
        color: var(--bf-theme-text-1);
        padding: 1.25rem;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        display: grid;
        gap: 1rem;
      }
      .panel {
        padding: 1rem;
        border-radius: var(--bf-theme-radius-md, 12px);
        border: 1px solid var(--bf-theme-border-1);
        background: var(--bf-theme-surface-1);
      }
      .theme-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
      }
      button.native {
        font: inherit;
        padding: 0.45rem 0.85rem;
        border-radius: var(--bf-theme-radius-md, 8px);
        border: 1px solid var(--bf-theme-border-1);
        background: var(--bf-theme-button-secondary-bg);
        color: var(--bf-theme-button-secondary-color);
        cursor: pointer;
      }
      .note {
        margin: 0 0 0.75rem;
        font-size: 0.9rem;
        color: var(--bf-theme-text-2);
        line-height: 1.55;
      }
      code {
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap" data-demo-root>
      <section class="panel">
        <div class="theme-controls">
          <label for="themeSelect">Theme</label>
          <select id="themeSelect">
            <option value="system">system</option>
            <option value="dark">dark</option>
            <option value="light">light</option>
            <option value="modern">modern</option>
            <option value="layout">layout</option>
            <option value="aurora">aurora</option>
            <option value="noir">noir</option>
            <option value="oceanic">oceanic</option>
            <option value="nature">nature</option>
            <option value="matrix">matrix</option>
            <option value="retro">retro</option>
            <option value="simple">simple</option>
            <option value="sprint">sprint</option>
            <option value="sunrise">sunrise</option>
            <option value="desert">desert</option>
            <option value="future">future</option>
            <option value="nebula">nebula</option>
          </select>
          <span id="themeStatus"></span>
        </div>
      </section>
      <section class="panel">
        <h2 style="margin: 0 0 0.35rem"><code>bf-modal</code></h2>
        <p class="note">
          Blocking overlay + dialog shell. Prefer <strong><code>bf-dialog</code></strong> for lightweight panels
          that are not modal (see README).
        </p>
        <button type="button" class="native" id="btnOpen">Open modal</button>
        <bf-modal id="dlg" label="Example modal">
          <p style="margin: 0 0 1rem">Modal content slots here.</p>
          <button type="button" class="native" id="btnClose">Close</button>
        </bf-modal>
      </section>
    </div>
    <script type="module" src="../dist/index.js"></script>
    <script type="module">
      const themeStylesheet = document.getElementById('themeStylesheet');
      const themeSelect = document.getElementById('themeSelect');
      const themeStatus = document.getElementById('themeStatus');
      function applyTheme(t) {
        themeStylesheet.href = '../themes/' + t + '.css';
        document.documentElement.setAttribute('data-bf-theme', t);
        themeStatus.textContent = 'Active: ' + t;
      }
      themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));
      applyTheme(themeSelect.value);

      await customElements.whenDefined('bf-modal');
      const modal = document.getElementById('dlg');
      document.getElementById('btnOpen').onclick = () => void modal.open();
      document.getElementById('btnClose').onclick = () => void modal.close();
    </script>
  </body>
</html>
